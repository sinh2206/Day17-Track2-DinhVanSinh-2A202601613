version: 2

models:
  # --------------------------------------------------------------- tickets
  - name: silver_tickets
    description: "Trạng thái mới nhất của mỗi ticket, dựng từ CDC."
    config:
      contract:
        enforced: true
    columns:
      - name: ticket_id
        data_type: varchar
        description: "Khoá của thực thể ticket."
        tests: [unique, not_null]
      - name: customer_id
        data_type: varchar
      - name: customer_name
        data_type: varchar
      - name: segment
        data_type: varchar
      - name: priority
        data_type: integer
        description: "1 = urgent … 4 = low. Hợp đồng với team backend."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false
      - name: category
        data_type: varchar
      - name: channel
        data_type: varchar
      - name: status
        data_type: varchar
      - name: csat
        data_type: integer
      - name: first_response_sec
        data_type: integer
      - name: subject
        data_type: varchar
      - name: body
        data_type: varchar
      - name: updated_at
        data_type: timestamp
      - name: _ingested_at
        data_type: timestamp

  # ---------------------------------------------------------------- events
  - name: silver_events
    description: "Sự kiện runtime, đã khử trùng lặp theo event_id."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_date
        tests: [not_null]

  # ----------------------------------------------------------- transcripts
  - name: silver_transcripts
    description: "Hội thoại, đã khử trùng lặp theo transcript_id."
    columns:
      - name: transcript_id
        tests: [unique, not_null]

  # ---------------------------------------------------------- quarantine
  - name: quarantine_tickets
    description: "Các bản ghi CDC bị loại vì priority không hợp lệ."
    columns:
      - name: ticket_id
        tests: [not_null]
      - name: cdc_seq
        tests: [not_null]
